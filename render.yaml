services:
  - type: web
    name: crypto-alert-frontend
    runtime: static
    branch: test/deploy
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://crypto-alert-api-sn2o.onrender.com

  - type: web
    name: crypto-alert-api
    runtime: python
    branch: test/deploy
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-alert-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        fromService:
          name: crypto-alert-frontend
          type: web
          property: host
      - key: BACKEND_CORS_ORIGIN_REGEX
        value: https?://.*
      - key: RABBITMQ_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: POLL_INTERVAL_SECONDS
        value: 120
      - key: COINGECKO_BASE_URL
        value: https://api.coingecko.com/api/v3

  - type: worker
    name: crypto-alert-worker
    runtime: python
    branch: test/deploy
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m worker.main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-alert-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256

databases:
  - name: crypto-alert-db
    databaseName: cryptoalert
    user: cryptoalert
    plan: free
